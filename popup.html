<!DOCTYPE html>
<html>

<head>
    <title>ProFill Settings</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --success: #10b981;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1f2937;
                color: #f3f4f6;
            }

            .custom-input {
                background-color: #374151;
                border-color: #4b5563;
                color: #f3f4f6;
            }

            .custom-input:focus {
                border-color: var(--primary);
            }

            .tab-btn {
                color: #9ca3af;
            }

            .tab-btn:hover {
                color: #f3f4f6;
            }

            .tab-btn.active {
                color: var(--primary);
            }
        }

        ::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
        }

        html,
        body {
            width: 500px;
            max-height: 600px;
            overflow-y: auto;
            margin: 0;
            padding: 0;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .input-group {
            margin-bottom: 1rem;
        }

        .custom-input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #e2e8f0;
            border-radius: 0.375rem;
            transition: all 0.2s;
        }

        .entry-card {
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            padding: 1rem;
        }
    </style>
</head>

<body class="p-4">
    <h1 class="text-2xl font-bold mb-4">ProFill</h1>

    <!-- Tabs -->
    <div class="mb-4 border-b border-gray-200">
        <ul class="flex flex-wrap -mb-px" role="tablist">
            <li class="mr-2">
                <button class="tab-btn active px-4 py-2 text-blue-600 border-b-2 border-blue-600"
                    data-tab="personal">Personal</button>
            </li>
            <li class="mr-2">
                <button class="tab-btn px-4 py-2" data-tab="education">Education</button>
            </li>
            <li class="mr-2">
                <button class="tab-btn px-4 py-2" data-tab="experience">Experience</button>
            </li>
            <li>
                <button class="tab-btn px-4 py-2" data-tab="skills">Skills</button>
            </li>
        </ul>
    </div>

    <!-- Personal Information -->
    <div id="personal" class="tab-content active">
        <div class="grid grid-cols-3 gap-4">
            <div class="input-group">
                <label class="block text-sm font-medium mb-1">First Name</label>
                <input type="text" id="firstName" class="custom-input personal-first">
            </div>
            <div class="input-group">
                <label class="block text-sm font-medium mb-1">Middle Name</label>
                <input type="text" id="middleName" class="custom-input personal-middle">
            </div>
            <div class="input-group">
                <label class="block text-sm font-medium mb-1">Last Name</label>
                <input type="text" id="lastName" class="custom-input personal-last">
            </div>
        </div>
        <div class="input-group">
            <label class="block text-sm font-medium mb-1">Email</label>
            <input type="email" id="email" class="custom-input personal-email">
        </div>
        <div class="input-group">
            <label class="block text-sm font-medium mb-1">Phone</label>
            <input type="tel" id="phone" class="custom-input personal-phone">
        </div>
        <div class="input-group">
            <label class="block text-sm font-medium mb-1">Professional Title</label>
            <input type="text" id="title" class="custom-input personal-title">
        </div>

        <!-- Address Section -->
        <div class="mt-4 mb-4">
            <h3 class="text-lg font-medium mb-2">Location</h3>
            <div class="grid grid-cols-2 gap-4">
                <div class="input-group">
                    <label class="block text-sm font-medium mb-1">Street Address</label>
                    <input type="text" id="street" class="custom-input personal-street">
                </div>
                <div class="input-group">
                    <label class="block text-sm font-medium mb-1">City</label>
                    <input type="text" id="city" class="custom-input personal-city">
                </div>
                <div class="input-group">
                    <label class="block text-sm font-medium mb-1">State</label>
                    <input type="text" id="state" class="custom-input personal-state">
                </div>
                <div class="input-group">
                    <label class="block text-sm font-medium mb-1">ZIP Code</label>
                    <input type="text" id="zipCode" class="custom-input personal-zip">
                </div>
            </div>
        </div>

        <!-- Social Links -->
        <div class="mt-4">
            <h3 class="text-lg font-medium mb-2">Social Links</h3>
            <div id="socialLinksContainer">
                <!-- Social links will be added here -->
            </div>
            <button id="addSocialLink" class="bg-blue-600 text-white px-4 py-2 rounded-lg mt-2">
                Add Social Link
            </button>
        </div>
    </div>

    <!-- Education -->
    <div id="education" class="tab-content">
        <div id="educationContainer">
            <!-- Education entries will be added here -->
        </div>
        <button id="addEducation" class="bg-blue-600 text-white px-4 py-2 rounded-lg mt-2">
            Add Education
        </button>
    </div>

    <!-- Experience -->
    <div id="experience" class="tab-content">
        <div id="experienceContainer">
            <!-- Experience entries will be added here -->
        </div>
        <button id="addExperience" class="bg-blue-600 text-white px-4 py-2 rounded-lg mt-2">
            Add Experience
        </button>
    </div>

    <!-- Skills -->
    <div id="skills" class="tab-content">
        <div class="input-group">
            <label class="block text-sm font-medium mb-1">Technical Skills</label>
            <textarea id="technicalSkills" class="custom-input skills-technical" rows="3"></textarea>
        </div>
        <div class="input-group">
            <label class="block text-sm font-medium mb-1">Tools & Technologies</label>
            <textarea id="tools" class="custom-input skills-tools" rows="3"></textarea>
        </div>
    </div>

    <!-- Buttons -->
    <div class="flex space-x-4 mt-6">
        <button id="saveButton" class="bg-blue-600 text-white px-4 py-2 rounded-lg w-1/2">Save</button>
        <button id="fillButton" class="bg-green-600 text-white px-4 py-2 rounded-lg w-1/2">Auto-Fill</button>
    </div>
</body>
<script src="popup.js"></script>

</html>
